<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGO | OVERSIGHT GLOBAL AGENCY</title>
    <style>
        :root {
            --ogo-cyan: #00f2ff;
            --ogo-dark: #020617;
            --ogo-card: #0f172a;
        }

        body {
            background-color: var(--ogo-dark);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            border-bottom: 2px solid var(--ogo-cyan);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .agency-title {
            color: var(--ogo-cyan);
            letter-spacing: 5px;
            font-weight: bold;
            margin: 0;
        }

        /* --- Operation Map Styles --- */
        .map-container {
            position: relative;
            width: 100%;
            height: 400px;
            background: #000;
            border: 1px solid #1e293b;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .world-map {
            width: 100%;
            height: 100%;
            opacity: 0.4;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_with_nations.svg');
            background-size: cover;
            filter: invert(1) hue-rotate(180deg) brightness(0.8);
        }

        .node {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--ogo-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--ogo-cyan);
            animation: pulse 2s infinite;
        }
        .node-bkk { top: 60%; left: 78%; }
        .node-mun { top: 30%; left: 48%; }
        .node-dxb { top: 45%; left: 63%; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            70% { transform: scale(3); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* --- News Feed Styles --- */
        #news-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .news-item {
            background: var(--ogo-card);
            border-left: 4px solid var(--ogo-cyan);
            padding: 15px;
            border-radius: 4px;
            transition: 0.3s;
        }

        .news-item:hover {
            background: #1e293b;
            transform: translateX(10px);
        }

        .news-item a {
            color: var(--ogo-cyan);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .status-tag {
            font-family: monospace;
            font-size: 12px;
            color: #64748b;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            color: var(--ogo-cyan);
            font-family: monospace;
            padding: 50px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1 class="agency-title">OFFICE OF GLOBAL OVERSIGHT</h1>
            <small>LEVEL 9 CLEARANCE REQUIRED | OPERATIVE: MONGKONLPORN</small>
        </div>
        <div id="utc-clock" style="font-family: monospace; color: var(--ogo-cyan);"></div>
    </div>

    <div class="map-container">
        <div class="world-map"></div>
        <div class="node node-bkk"></div>
        <div class="node node-mun"></div>
        <div class="node node-dxb"></div>
        <div style="position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 5px; font-size: 10px; color: var(--ogo-cyan); border: 1px solid var(--ogo-cyan);">
            SCANNING GLOBAL NODES... ACTIVE
        </div>
    </div>

    <h2 style="border-left: 10px solid var(--ogo-cyan); padding-left: 10px;">INTELLIGENCE FEED</h2>
    
    <div id="news-container">
        <div class="loading">INITIATING SECURE CONNECTION...</div>
    </div>

    <script>
        // 1. ระบบนาฬิกา UTC
        function updateClock() {
            const now = new Date();
            document.getElementById('utc-clock').innerText = "SYSTEM TIME: " + now.toUTCString().split(' ')[4] + " UTC";
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. ระบบดึงข่าวกรอง (แก้ปัญหา Chrome/CORS)
        async function fetchOgoNews() {
            const newsContainer = document.getElementById("news-container");
            const rssUrl = 'https://news.google.com/rss/search?q=cybersecurity+threats&hl=en-US&gl=US&ceid=US:en';
            
            // ใช้ AllOrigins Proxy ที่เสถียรที่สุดสำหรับ Chrome
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                const items = xmlDoc.querySelectorAll("item");

                let html = "";
                // ดึง 6 ข่าวล่าสุด
                for(let i = 0; i < 6; i++) {
                    const title = items[i].querySelector("title").textContent;
                    const link = items[i].querySelector("link").textContent;
                    const date = items[i].querySelector("pubDate").textContent;

                    html += `
                        <div class="news-item">
                            <a href="${link}" target="_blank">${title}</a>
                            <div class="status-tag">SOURCE: GLOBAL_INTEL | TIMESTAMP: ${date}</div>
                        </div>
                    `;
                }
                newsContainer.innerHTML = html;
                console.log("OGO Intelligence: Stream Restored.");
            } catch (error) {
                console.error("Critical Error:", error);
                newsContainer.innerHTML = "<div class='loading' style='color: red;'>CRITICAL ERROR: ACCESS TO DATA STREAM DENIED.</div>";
            }
        }

        // เริ่มภารกิจเมื่อหน้าเว็บโหลดเสร็จ
        window.onload = fetchOgoNews;
    </script>
</body>
</html>
