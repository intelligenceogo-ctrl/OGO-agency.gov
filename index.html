<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGO | GLOBAL OVERSIGHT COMMAND</title>
    <style>
        :root { --neon: #00f2ff; --bg: #020617; --card: #0f172a; --danger: #ff4444; }
        body { background: var(--bg); color: #f8fafc; font-family: 'Courier New', monospace; margin: 0; padding: 20px; overflow-x: hidden; }
        
        .ogo-header { border-bottom: 2px solid var(--neon); padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.8); }
        .logo-text { color: var(--neon); font-size: 24px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 10px var(--neon); }
        
        /* Map Section - แก้ปัญหา Offline */
        .map-box { position: relative; width: 100%; height: 350px; background: #000; border: 1px solid var(--neon); border-radius: 8px; overflow: hidden; margin-bottom: 20px; box-shadow: inset 0 0 20px rgba(0, 242, 255, 0.2); }
        .world-map { width: 100%; height: 100%; opacity: 0.2; background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); } /* ใช้ pattern สำรองถ้าโหลดแผนที่ไม่ได้ */
        
        .node { position: absolute; width: 10px; height: 10px; background: var(--neon); border-radius: 50%; box-shadow: 0 0 15px var(--neon); }
        .node::after { content: ''; position: absolute; width: 100%; height: 100%; background: var(--neon); border-radius: 50%; animation: pulse 2s infinite; }
        
        /* พิกัด Node */
        .n-bkk { top: 60%; left: 78%; } 
        .n-man { top: 30%; left: 48%; }
        .n-dxb { top: 45%; left: 63%; }

        @keyframes pulse { 0% {transform: scale(1); opacity: 1;} 100% {transform: scale(4); opacity: 0;} }

        .status-bar { position: absolute; top: 10px; left: 10px; color: var(--neon); font-size: 10px; background: rgba(0,0,0,0.8); padding: 5px; border: 1px solid var(--neon); }

        /* News Section */
        #intel-stream { display: grid; gap: 12px; }
        .intel-card { background: var(--card); border-left: 4px solid var(--neon); padding: 15px; border-radius: 0 5px 5px 0; }
        .intel-card a { color: var(--neon); text-decoration: none; font-weight: bold; display: block; margin-bottom: 5px; }
        .intel-meta { font-size: 11px; color: #64748b; text-transform: uppercase; }
        
        .error-msg { color: var(--danger); text-align: center; padding: 40px; font-weight: bold; border: 1px dashed var(--danger); }
    </style>
</head>
<body>

    <div class="ogo-header">
        <div>
            <div class="logo-text">OGO // GLOBAL_CORE</div>
            <div style="font-size: 12px; color: var(--neon)">OPERATIVE: MONGKONLPORN | STATUS: ENCRYPTED</div>
        </div>
        <div id="system-time" style="color: var(--neon); font-weight: bold;"></div>
    </div>

    <div class="map-box">
        <div class="world-map"></div>
        <div class="node n-bkk" title="HQ THAILAND"></div>
        <div class="node n-man" title="MANCHESTER NODE"></div>
        <div class="node n-dxb" title="DUBAI HUB"></div>
        <div class="status-bar" id="node-status">CORE SYSTEM: ONLINE // ALL NODES ACTIVE</div>
    </div>

    <div style="background: var(--neon); color: var(--bg); padding: 5px 15px; display: inline-block; font-weight: bold; margin-bottom: 15px;">SECURE_DATA_STREAM</div>
    
    <div id="intel-stream">
        <div style="text-align: center; color: var(--neon); padding: 20px;">SYNCING WITH SATELLITE...</div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('system-time').innerText = "T-TIME: " + now.toUTCString().split(' ')[4] + " UTC";
        }
        setInterval(updateTime, 1000);

        async function fetchIntel() {
            const stream = document.getElementById("intel-stream");
            const rss = 'https://news.google.com/rss/search?q=cybersecurity+vulnerability&hl=en-US&gl=US&ceid=US:en';
            
            try {
                // เพิ่ม Timestamp เพื่อป้องกัน Cache
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(rss)}&_=${Date.now()}`);
                const data = await response.json();
                
                const parser = new DOMParser();
                const xml = parser.parseFromString(data.contents, "text/xml");
                const items = xml.querySelectorAll("item");

                let html = "";
                // ดึง 5 ข่าวล่าสุด
                for(let i=0; i<Math.min(5, items.length); i++) {
                    const title = items[i].querySelector("title").textContent;
                    const link = items[i].querySelector("link").textContent;
                    const date = items[i].querySelector("pubDate").textContent;

                    html += `
                        <div class="intel-card">
                            <a href="${link}" target="_blank">>> ${title}</a>
                            <div class="intel-meta">RELAY: GLOBAL_INTEL | DATE: ${date}</div>
                        </div>
                    `;
                }
                stream.innerHTML = html;
                document.getElementById('node-status').innerText = "CORE SYSTEM: ONLINE // DATA STREAM ESTABLISHED";
            } catch (e) {
                stream.innerHTML = "<div class='error-msg'>CRITICAL ERROR: DATA STREAM ACCESS DENIED // CHECK FIREWALL</div>";
                document.getElementById('node-status').style.color = "var(--danger)";
                document.getElementById('node-status').innerText = "CORE SYSTEM: CRITICAL // NODES UNREACHABLE";
            }
        }

        window.onload = () => {
            updateTime();
            fetchIntel();
        };
    </script>
</body>
</html>
