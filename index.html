<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGO | GLOBAL OVERSIGHT COMMAND CENTER</title>
    <style>
        /* --- DESIGN SYSTEM BY OGO --- */
        :root {
            --neon: #00f2ff;
            --bg: #020617;
            --card: #0f172a;
            --text: #f8fafc;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            border-bottom: 2px solid var(--neon);
            padding: 15px 0;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .agency-info h1 {
            color: var(--neon);
            margin: 0;
            letter-spacing: 4px;
            font-size: 24px;
        }

        .agency-info small {
            color: var(--neon);
            opacity: 0.8;
        }

        /* Operation Map Section */
        .map-box {
            position: relative;
            width: 100%;
            height: 350px;
            background: #000;
            border: 1px solid #1e293b;
            border-radius: 8px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .world-map {
            width: 100%;
            height: 100%;
            opacity: 0.3;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_with_nations.svg');
            background-size: cover;
            filter: invert(1) hue-rotate(180deg);
        }

        /* Pulse Nodes */
        .node {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--neon);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon);
            animation: pulse 2s infinite;
        }
        .node-bkk { top: 60%; left: 78%; }
        .node-mun { top: 30%; left: 48%; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            70% { transform: scale(3); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Intelligence Feed */
        .feed-title {
            background: var(--neon);
            color: var(--bg);
            padding: 5px 15px;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 15px;
            clip-path: polygon(0% 0%, 90% 0%, 100% 100%, 0% 100%);
        }

        #intel-stream {
            display: grid;
            gap: 12px;
        }

        .intel-card {
            background: var(--card);
            border-left: 5px solid var(--neon);
            padding: 15px;
            transition: 0.3s;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .intel-card:hover {
            background: #1e293b;
            transform: translateX(10px);
        }

        .intel-card h3 {
            color: var(--neon);
            margin: 0 0 8px 0;
            font-size: 16px;
        }

        .intel-meta {
            font-size: 11px;
            color: #64748b;
        }

        .loading-text {
            color: var(--neon);
            text-align: center;
            padding: 50px;
            letter-spacing: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0.2; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="agency-info">
            <h1>OGO // GLOBAL OVERSIGHT</h1>
            <small>OPERATIVE: MONGKONLPORN | ACCESS: LEVEL 9</small>
        </div>
        <div id="clock" style="color: var(--neon); font-weight: bold;">00:00:00 UTC</div>
    </div>

    <div class="map-box">
        <div class="world-map"></div>
        <div class="node node-bkk" title="HQ THAILAND"></div>
        <div class="node node-mun" title="NODE MANCHESTER"></div>
        <div style="position: absolute; bottom: 10px; left: 10px; color: var(--neon); font-size: 10px; background: rgba(0,0,0,0.6); padding: 5px;">
            SATELLITE LINK: ACTIVE | SCANNING...
        </div>
    </div>

    <div class="feed-title">LIVE_INTEL_STREAM</div>
    <div id="intel-stream">
        <div class="loading-text">BYPASSING CORS FIREWALL...</div>
    </div>

    <script>
        // 1. ระบบนาฬิกา
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toUTCString().split(' ')[4] + " UTC";
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. ระบบดึงข่าวจาก RSS.app (ท่าน CTO ส่งลิงก์มาให้แล้ว)
        async function fetchIntel() {
            const stream = document.getElementById("intel-stream");
            const rssUrl = 'https://rss.app/feeds/15fzqDemVSMLHmRX.xml';
            
            // ใช้ AllOrigins Proxy เพื่อแก้ปัญหา CORS ใน Chrome
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;

            try {
                console.log("OGO SYSTEM: Establishing secure data tunnel...");
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                const items = xmlDoc.querySelectorAll("item");

                let html = "";
                // แสดง 6 ข่าวล่าสุด
                for (let i = 0; i < Math.min(items.length, 6); i++) {
                    const title = items[i].querySelector("title").textContent;
                    const link = items[i].querySelector("link").textContent;
                    const date = items[i].querySelector("pubDate").textContent;

                    html += `
                        <a href="${link}" target="_blank" class="intel-card">
                            <h3>${title}</h3>
                            <div class="intel-meta">SOURCE: RSS_GATEWAY | TIMESTAMP: ${new Date(date).toLocaleString()}</div>
                        </a>
                    `;
                }
                
                stream.innerHTML = html;
                console.log("OGO SYSTEM: Intelligence stream verified.");

            } catch (error) {
                console.error("Critical Failure:", error);
                stream.innerHTML = "<div style='color:red; text-align:center; padding: 20px; border: 1px solid red;'>CRITICAL ERROR: DATA_STREAM_DENIED</div>";
            }
        }

        // เริ่มต้นการดึงข้อมูล
        window.onload = fetchIntel;
    </script>
</body>
</html>
