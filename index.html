<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>OGO | GLOBAL THREAT MONITOR</title>
    <style>
        :root { --neon-blue: #00f2ff; --neon-red: #ff0044; --bg-dark: #050a10; }
        body { background: var(--bg-dark); color: #fff; font-family: 'Segoe UI', monospace; margin: 0; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--neon-blue); padding-bottom: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        
        /* Box Style */
        .monitor-box { border: 1px solid #1a2635; background: rgba(10, 20, 35, 0.8); padding: 15px; border-radius: 5px; height: 500px; overflow-y: auto; }
        .box-title { color: var(--neon-blue); font-weight: bold; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }

        /* News Item */
        .news-item { border-left: 3px solid var(--neon-blue); padding: 10px; margin-bottom: 10px; background: rgba(255,255,255,0.05); transition: 0.3s; }
        .news-item:hover { background: rgba(0, 242, 255, 0.1); }
        .threat-high { border-left-color: var(--neon-red); animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { box-shadow: inset 0 0 5px var(--neon-red); } 50% { box-shadow: inset 0 0 15px var(--neon-red); } 100% { box-shadow: inset 0 0 5px var(--neon-red); } }

        .tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; margin-right: 5px; text-transform: uppercase; }
        .tag-intel { background: #0055ff; }
        .tag-critical { background: var(--neon-red); }
    </style>
</head>
<body>

    <div class="header">
        <div>OGO LOGS: <span id="clock">00:00:00</span></div>
        <div style="color: var(--neon-blue);">SYSTEM STATUS: MONITORING GLOBAL SECTORS</div>
    </div>

    <div class="grid">
        <div class="monitor-box">
            <div class="box-title">📡 Global Media Intelligence</div>
            <div id="media-feed">
                <div class="news-item">
                    <span class="tag tag-intel">RSS</span>
                    <strong>[REUTERS]</strong> Global energy markets stabilize after security intervention...
                </div>
            </div>
        </div>

        <div class="monitor-box">
            <div class="box-title" style="color: var(--neon-red);">⚠️ Security Threats</div>
            <div id="threat-feed">
                <div class="news-item threat-high">
                    <span class="tag tag-critical">High Risk</span>
                    <strong>[CYBER]</strong> Massive DDoS attack detected in SE-Asia sector.
                </div>
            </div>
        </div>
    </div>

    <script>
      const API_KEY = ccb0515ea35e497582b97b4ceeae7ab6
const newsUrl = `https://newsapi.org/v2/top-headlines?country=th&category=technology&apiKey=${API_KEY}`;

async function fetchGlobalNews() {
    try {
        const response = await fetch(newsUrl); // ส่งคำสั่งดึงข้อมูล
        const data = await response.json();    // แปลงข้อมูลเป็นรูปแบบที่อ่านง่าย
        displayNews(data.articles);            // ส่งข้อมูลไปแสดงผลบนหน้าจอ
    } catch (error) {
        console.error("การดึงข้อมูลล้มเหลว:", error);
    }
}

function displayNews(articles) {
    const feed = document.getElementById('media-feed');
    feed.innerHTML = ''; // ล้างข้อมูลเก่าออกก่อน
    
    articles.forEach(article => {
        const item = document.createElement('div');
        item.className = 'news-item';
        // แสดงชื่อหัวข้อข่าวและลิงก์สำหรับอ่านต่อ
        item.innerHTML = `
            <strong>[${article.source.name}]</strong> ${article.title}
            <br><small>${new Date(article.publishedAt).toLocaleString()}</small>
            <a href="${article.url}" target="_blank" style="color:#00f2ff; font-size:10px;"> [READ MORE]</a>
        `;
        feed.appendChild(item);
    });
}

// สั่งให้ทำงานทันทีเมื่อเปิดหน้าเว็บ
fetchGlobalNews();
    </script>
</body>
</html>
